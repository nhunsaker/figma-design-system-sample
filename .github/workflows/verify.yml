name: verify

# The gate. Everything here is blocking, including the checks that report they could not run,
# because a check that did not run is not a check that passed.

on:
  # `ready_for_review` matters. An agent opens a draft with a work-in-progress checklist for a
  # body and fills in the real description later, so the default trigger list checks a body that
  # was never meant to be read, and the contract check fails on a pull request that is correct.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm test:types

      - name: Lint
        run: pnpm test:lint

      - name: Design pack is in sync with the token files
        run: pnpm test:pack

      - name: Source obeys the design pack
        run: pnpm test:contract

      - name: Tests
        run: pnpm test

      - name: Application builds
        run: pnpm exec vite build

      - name: Storybook builds
        run: pnpm build-storybook --quiet

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm --filter figma-bridge-worker test:types

      - name: Tests, in workerd, against the same contract the Python service is held to
        run: pnpm --filter figma-bridge-worker test

  pull-request-contract:
    # Drafts are exempt on purpose. A draft is a statement that the work is not finished, and
    # holding one to a contract about finished work is how you teach people to ignore a check.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5

      # Read the body from the API rather than the event payload. The payload is a snapshot from
      # when the event fired, and a body edited after that is invisible to it. Reading it live
      # means this check is correct whenever it runs, instead of only when it runs first.
      - name: Fetch the pull request body as it stands now
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            --jq .body > "${RUNNER_TEMP}/pr-body.md"

      - name: Pull request body fills the contract
        run: node scripts/check-pr-contract.mjs --body-file "${RUNNER_TEMP}/pr-body.md"
